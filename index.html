<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App 2.0</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <script type="module" src="src/main.js"></script>
</head>

<body>
<main>
    <section id="mainContainer" class="weather-info">
        <div id="weatherSearchView" class="weather-info__search-view">
            <label for="searchInput">Check weather:</label>
            <div class="weather-info__search-input-wrapper">
                <input id="searchInput" type="text" autocomplete="off">
                <ul id="searchInputSuggestionsList">
                </ul>
            </div>
            <button id="searchButton">Search</button>
        </div>

        <div id="weatherForecastView" class="weather-info__forecast-view">
            <button id="returnToSearchViewBtn" class="weather-info__return-btn">Return</button>
            <div class="weather-info__city">
                <h1 id="weatherCity"></h1>
                <img id="weatherIcon" alt="">
            </div>

            <div class="weather-info__details">
                <p id="weatherCurrentTemperature"></p>
                <p id="weatherAirPressure"></p>
                <p id="weatherHumidity"></p>
            </div>
        </div>
    </section>
</main>
</body>
</html>
